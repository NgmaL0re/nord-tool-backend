SPS.APARTAMENTO_VISTORIA_PAGINACAO=\
OFFSET :nrPagina ROWS FETCH NEXT :nrQuantidadePorPagina ROWS ONLY;

SPI.APARTAMENTO_VISTORIA=\
INSERT INTO apartamento_vistoria ( \
    nm_apartamento_vistoria, \
    id_dia_semana, \
    dt_apartamento_vigente, \
    nm_horario_vistoria, \
    id_status_vistoria, \
    in_marcar_revistoria, \
    tx_observacao_revistoria, \
    dt_revistoria_vigente \
) \
VALUES ( \
    :nmApartamentoVistoria, \
    :idDiaSemana, \
    :dtApartamentoVigente, \
    :nmHorarioVistoria, \
    :idStatusVistoria, \
    :inMarcarRevistoria, \
    :txObservacaoRevistoria, \
    :dtRevistoriaVigente \
)

SPU.APARTAMENTO_VISTORIA=\
UPDATE apartamento_vistoria \
SET nm_apartamento_vistoria   = :nmApartamentoVistoria, \
id_dia_semana             = :idDiaSemana, \
dt_apartamento_vigente    = :dtApartamentoVigente, \
nm_horario_vistoria       = :nmHorarioVistoria, \
id_status_vistoria        = :idStatusVistoria, \
in_marcar_revistoria      = :inMarcarRevistoria, \
tx_observacao_revistoria  = :txObservacaoRevistoria, \
dt_revistoria_vigente     = :dtRevistoriaVigente \
WHERE id_apartamento_vistoria   = :id

SPD.APARTAMENTO_VISTORIA.WHERE.ID=\
DELETE FROM apartamento_vistoria WHERE id_apartamento_vistoria = :id

SPS.BUSCAR.APARTAMENTO_VISTORIA=\
SELECT \
    av.id_apartamento_vistoria      AS id, \
    av.nm_apartamento_vistoria      AS nmApartamentoVistoria, \
    av.id_dia_semana                AS idDiaSemana, \
    ds.nm_dia_semana                AS nmDiaSemana, \
    av.dt_apartamento_vigente       AS dtApartamentoVigente, \
    av.nm_horario_vistoria           AS nmHorarioVistoria, \
    av.id_status_vistoria            AS idStatusVistoria, \
    sv.nm_status_vistoria            AS nmStatusVistoria, \
    av.in_marcar_revistoria          AS inMarcarRevistoria, \
    av.tx_observacao_revistoria      AS txObservacaoRevistoria, \
    av.dt_revistoria_vigente         AS dtRevistoriaVigente \
FROM apartamento_vistoria av \
INNER JOIN dia_semana ds ON av.id_dia_semana = ds.id_dia_semana \
INNER JOIN status_vistoria sv ON av.id_status_vistoria = sv.id_status_vistoria \
WHERE id_apartamento_vistoria = :id

SPS.LISTAR.APARTAMENTO_VISTORIA=\
SELECT \
    av.id_apartamento_vistoria      AS id, \
    av.nm_apartamento_vistoria      AS nmApartamentoVistoria, \
    av.id_dia_semana                AS idDiaSemana, \
    ds.nm_dia_semana                AS nmDiaSemana, \
    av.dt_apartamento_vigente       AS dtApartamentoVigente, \
    av.nm_horario_vistoria           AS nmHorarioVistoria, \
    av.id_status_vistoria            AS idStatusVistoria, \
    sv.nm_status_vistoria            AS nmStatusVistoria, \
    av.in_marcar_revistoria          AS inMarcarRevistoria, \
    av.tx_observacao_revistoria      AS txObservacaoRevistoria, \
    av.dt_revistoria_vigente         AS dtRevistoriaVigente \
FROM apartamento_vistoria av \
INNER JOIN dia_semana ds ON av.id_dia_semana = ds.id_dia_semana \
INNER JOIN status_vistoria sv ON av.id_status_vistoria = sv.id_status_vistoria 

SPS.LISTAR.APARTAMENTO_VISTORIA_FILTRAR_TODOS=\
SELECT \
    av.id_apartamento_vistoria      AS id, \
    av.nm_apartamento_vistoria      AS nmApartamentoVistoria, \
    av.id_dia_semana                AS idDiaSemana, \
    ds.nm_dia_semana                AS nmDiaSemana, \
    av.dt_apartamento_vigente       AS dtApartamentoVigente, \
    av.nm_horario_vistoria           AS nmHorarioVistoria, \
    av.id_status_vistoria            AS idStatusVistoria, \
    sv.nm_status_vistoria            AS nmStatusVistoria, \
    av.in_marcar_revistoria          AS inMarcarRevistoria, \
    av.tx_observacao_revistoria      AS txObservacaoRevistoria, \
    av.dt_revistoria_vigente         AS dtRevistoriaVigente \
FROM apartamento_vistoria av \
INNER JOIN dia_semana ds ON av.id_dia_semana = ds.id_dia_semana \
INNER JOIN status_vistoria sv ON av.id_status_vistoria = sv.id_status_vistoria \
WHERE :filtraTodos IS NULL \
    OR av.nm_apartamento_vistoria LIKE :filtraTodos \
    OR ds.nm_dia_semana LIKE :filtraTodos \
    OR av.nm_horario_vistoria LIKE :filtraTodos \
    OR sv.nm_status_vistoria LIKE :filtraTodos \
    OR av.tx_observacao_revistoria LIKE :filtraTodos

SPS.LISTAR.APARTAMENTO_VISTORIA_FILTRAR_ATRIBUTO=\
SELECT \
    av.id_apartamento_vistoria      AS id, \
    av.nm_apartamento_vistoria      AS nmApartamentoVistoria, \
    av.id_dia_semana                AS idDiaSemana, \
    ds.nm_dia_semana                AS nmDiaSemana, \
    av.dt_apartamento_vigente       AS dtApartamentoVigente, \
    av.nm_horario_vistoria           AS nmHorarioVistoria, \
    av.id_status_vistoria            AS idStatusVistoria, \
    sv.nm_status_vistoria            AS nmStatusVistoria, \
    av.in_marcar_revistoria          AS inMarcarRevistoria, \
    av.tx_observacao_revistoria      AS txObservacaoRevistoria, \
    av.dt_revistoria_vigente         AS dtRevistoriaVigente, \
    COUNT(*) OVER () AS nrTotalRegistros \
FROM apartamento_vistoria av \
INNER JOIN dia_semana ds ON av.id_dia_semana = ds.id_dia_semana \
INNER JOIN status_vistoria sv ON av.id_status_vistoria = sv.id_status_vistoria \
WHERE (:nmApartamentoVistoria IS NULL OR av.nm_apartamento_vistoria = :nmApartamentoVistoria) \
    AND (:nmDiaSemana IS NULL OR ds.nm_dia_semana = :nmDiaSemana) \
    AND (:dtApartamentoVigente IS NULL OR av.dt_apartamento_vigente = :dtApartamentoVigente) \
    AND (:nmHorarioVistoria IS NULL OR av.nm_horario_vistoria = :nmHorarioVistoria) \
    AND (:nmStatusVistoria IS NULL OR sv.nm_status_vistoria = :nmStatusVistoria) \
    AND (:txObservacaoRevistoria IS NULL OR av.tx_observacao_revistoria = :txObservacaoRevistoria) \
    AND (:dtRevistoriaVigente IS NULL OR av.dt_revistoria_vigente = :dtRevistoriaVigente)